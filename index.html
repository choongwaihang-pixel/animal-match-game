
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff0f6">
<title> 动物乐园 - 开心消消乐</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 18px 12px 30px;
  font-family: Arial, sans-serif;
  text-align: center;
  color: #674b68;
  background: linear-gradient(135deg, #fff0f5, #e6f5ff, #fff5df);
}

.container {
  width: 100%;
  max-width: 480px;
  margin: auto;
}

h1 {
  color: #ff72a5;
  font-size: 30px;
  margin: 8px 0;
}

.subtitle {
  color: #987a9b;
  margin-bottom: 20px;
}

.info {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
}

.info-card {
  flex: 1;
  background: white;
  border-radius: 18px;
  padding: 12px;
  box-shadow: 0 4px 12px #e8c9dc;
}

.info-card div {
  font-size: 13px;
}

.info-card strong {
  display: block;
  font-size: 26px;
  color: #ff72a5;
  margin-top: 5px;
}

.board {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 5px;
  padding: 9px;
  background: #f6c9df;
  border-radius: 20px;
  box-shadow: 0 7px 18px #dfb5ce;
  touch-action: manipulation;
}

.cell {
  position: relative;
  min-width: 0;
  aspect-ratio: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  background: white;
  border-radius: 11px;
  font-size: clamp(19px, 6vw, 34px);
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  will-change: transform, opacity;
}

.cell.selected {
  background: #ffe77c;
  outline: 3px solid #ff9e50;
  z-index: 2;
  animation: selectedPulse .55s infinite alternate;
}

@keyframes selectedPulse {
  from { transform: scale(1); }
  to { transform: scale(.90); }
}

/* 消除动画 */
.cell.matched {
  animation: animalPop .32s ease-in forwards;
  pointer-events: none;
  z-index: 5;
}

@keyframes animalPop {
  0% {
    transform: scale(1) rotate(0);
    opacity: 1;
  }
  45% {
    transform: scale(1.3) rotate(12deg);
    opacity: 1;
  }
  100% {
    transform: scale(0) rotate(-25deg);
    opacity: 0;
  }
}

/* 新动物掉落动画 */
.cell.falling {
  animation: animalFall .3s ease-out;
}

@keyframes animalFall {
  from {
    transform: translateY(-70px);
    opacity: .2;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

button {
  border: none;
  border-radius: 28px;
  padding: 14px 28px;
  margin-top: 20px;
  background: #ff79a9;
  color: white;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 9px #e5b5ce;
}

button:active {
  transform: scale(.95);
}

.message {
  margin-top: 16px;
  min-height: 28px;
  font-weight: bold;
  color: #a16d95;
}

.instructions {
  margin-top: 18px;
  padding: 15px;
  border-radius: 17px;
  background: white;
  font-size: 14px;
  line-height: 1.9;
  box-shadow: 0 3px 10px #ead7e5;
}

@media(max-width:380px) {
  body { padding: 10px 5px; }
  .board { gap: 3px; padding: 6px; }
  .cell { border-radius: 7px; }
  h1 { font-size: 25px; }
}

@media(prefers-reduced-motion: reduce) {
  .cell.selected {
    animation: none;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>🐼 动物乐园 🐰</h1>
  <div class="subtitle">✨ 开心消消乐 2.0 ✨</div>

  <div class="info">
    <div class="info-card">
      <div>🏆 我的分数</div>
      <strong id="score">0</strong>
    </div>

    <div class="info-card">
      <div>👣 剩余步数</div>
      <strong id="moves">30</strong>
    </div>
  </div>

  <div id="board" class="board"></div>

  <div id="message" class="message">
    点击两个相邻动物来交换吧！🐻
  </div>

  <button onclick="startGame()">
    🔄 重新开始
  </button>

  <div class="instructions">
    🐼 游戏规则<br>
    1. 点击两个相邻的动物交换位置。<br>
    2. 三个或以上相同动物连在一起即可消除。<br>
    3. 消除后动物会自动掉落。<br>
    4. 每次成功交换消耗一步。<br>
    5. 每个消除的动物获得10分！
  </div>

</div>

<script>
const SIZE = 8;

const animals = [
  "🐼", "🐰", "🐱",
  "🐻", "🦊", "🐸"
];

let board = [];
let score = 0;
let moves = 30;
let selected = null;
let busy = false;

function randomAnimal() {
  return animals[
    Math.floor(Math.random() * animals.length)
  ];
}

// 创建初始棋盘
function createBoard() {
  board = [];

  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      let animal;

      do {
        animal = randomAnimal();
      } while (
        (c >= 2 &&
          board[r * SIZE + c - 1] === animal &&
          board[r * SIZE + c - 2] === animal) ||
        (r >= 2 &&
          board[(r - 1) * SIZE + c] === animal &&
          board[(r - 2) * SIZE + c] === animal)
      );

      board.push(animal);
    }
  }
}

// 开始游戏
function startGame() {
  score = 0;
  moves = 30;
  selected = null;
  busy = false;

  createBoard();
  updateMessage("点击两个相邻动物来交换吧！🐻");
  render();
}

// 绘制棋盘
function render() {
  document.getElementById("score").textContent = score;
  document.getElementById("moves").textContent = moves;

  const el = document.getElementById("board");
  el.innerHTML = "";

  board.forEach((animal, i) => {
    const cell = document.createElement("div");

    cell.className = "cell";
    cell.dataset.index = i;

    if (selected === i) {
      cell.classList.add("selected");
    }

    cell.textContent = animal || "";

    cell.addEventListener("click", () => clickCell(i));

    el.appendChild(cell);
  });
}

function updateMessage(message) {
  document.getElementById("message").textContent = message;
}

// 检查两个格子是否相邻
function adjacent(a, b) {
  const rowA = Math.floor(a / SIZE);
  const colA = a % SIZE;

  const rowB = Math.floor(b / SIZE);
  const colB = b % SIZE;

  return (
    Math.abs(rowA - rowB) +
    Math.abs(colA - colB) === 1
  );
}

// 点击动物
function clickCell(i) {
  if (busy || moves <= 0) return;

  if (selected === null) {
    selected = i;
    render();
    return;
  }

  if (selected === i) {
    selected = null;
    render();
    return;
  }

  if (!adjacent(selected, i)) {
    selected = i;
    render();
    return;
  }

  const a = selected;
  selected = null;

  swap(a, i);
}

// 交换动画
async function swap(a, b) {
  busy = true;

  const cells = document.querySelectorAll(".cell");

  const rectA = cells[a].getBoundingClientRect();
  const rectB = cells[b].getBoundingClientRect();

  const dx = rectB.left - rectA.left;
  const dy = rectB.top - rectA.top;

  const animationA = cells[a].animate(
    [
      { transform: "translate(0, 0)" },
      { transform: `translate(${dx}px, ${dy}px)` }
    ],
    {
      duration: 260,
      easing: "ease-in-out",
      fill: "forwards"
    }
  );

  const animationB = cells[b].animate(
    [
      { transform: "translate(0, 0)" },
      { transform: `translate(${-dx}px, ${-dy}px)` }
    ],
    {
      duration: 260,
      easing: "ease-in-out",
      fill: "forwards"
    }
  );

  await Promise.all([
    animationA.finished,
    animationB.finished
  ]);

  [board[a], board[b]] = [board[b], board[a]];

  render();

  const matches = findMatches();

  if (matches.length === 0) {
    // 无法消除时交换回原来的位置
    const newCells = document.querySelectorAll(".cell");

    const backA = newCells[a].animate(
      [
        { transform: "translate(0, 0)" },
        { transform: `translate(${dx}px, ${dy}px)` }
      ],
      { duration: 200, easing: "ease-in-out" }
    );

    const backB = newCells[b].animate(
      [
        { transform: "translate(0, 0)" },
        { transform: `translate(${-dx}px, ${-dy}px)` }
      ],
      { duration: 200, easing: "ease-in-out" }
    );

    await Promise.all([backA.finished, backB.finished]);

    [board[a], board[b]] = [board[b], board[a]];

    busy = false;
    render();
    updateMessage("没有形成三消哦，再试一次！🐰");
    return;
  }

  moves--;
  render();

  await resolveMatches();
}

// 寻找所有三个或以上相同动物
function findMatches() {
  const found = new Set();

  // 横向检查
  for (let r = 0; r < SIZE; r++) {
    let c = 0;

    while (c < SIZE) {
      const animal = board[r * SIZE + c];

      if (!animal) {
        c++;
        continue;
      }

      let end = c + 1;

      while (
        end < SIZE &&
        board[r * SIZE + end] === animal
      ) {
        end++;
      }

      if (end - c >= 3) {
        for (let k = c; k < end; k++) {
          found.add(r * SIZE + k);
        }
      }

      c = end;
    }
  }

  // 纵向检查
  for (let c = 0; c < SIZE; c++) {
    let r = 0;

    while (r < SIZE) {
      const animal = board[r * SIZE + c];

      if (!animal) {
        r++;
        continue;
      }

      let end = r + 1;

      while (
        end < SIZE &&
        board[end * SIZE + c] === animal
      ) {
        end++;
      }

      if (end - r >= 3) {
        for (let k = r; k < end; k++) {
          found.add(k * SIZE + c);
        }
      }

      r = end;
    }
  }

  return [...found];
}

// 动物掉落并补充新动物
function dropAnimals() {
  const newAnimals = new Set();

  for (let c = 0; c < SIZE; c++) {
    const remaining = [];

    for (let r = SIZE - 1; r >= 0; r--) {
      const animal = board[r * SIZE + c];

      if (animal) {
        remaining.push(animal);
      }
    }

    while (remaining.length < SIZE) {
      remaining.push(randomAnimal());
      newAnimals.add(
        (SIZE - remaining.length) * SIZE + c
      );
    }

    for (let r = SIZE - 1; r >= 0; r--) {
      board[r * SIZE + c] =
        remaining[SIZE - 1 - r];
    }
  }

  return newAnimals;
}

// 消除、掉落和连锁消除
async function resolveMatches() {
  let matches = findMatches();

  while (matches.length > 0) {

    // 播放消失动画
    matches.forEach(i => {
      const cell = document.querySelector(
        `.cell[data-index="${i}"]`
      );

      if (cell) {
        cell.classList.add("matched");
      }
    });

    await new Promise(resolve =>
      setTimeout(resolve, 330)
    );

    // 计算分数
    score += matches.length * 10;

    // 移除动物
    matches.forEach(i => {
      board[i] = null;
    });

    render();

    // 补充动物
    const newAnimals = dropAnimals();

    render();

    // 新动物从上方掉落
    newAnimals.forEach(i => {
      const cell = document.querySelector(
        `.cell[data-index="${i}"]`
      );

      if (cell) {
        cell.classList.add("falling");
      }
    });

    await new Promise(resolve =>
      setTimeout(resolve, 320)
    );

    // 检查连锁消除
    matches = findMatches();
  }

  busy = false;
  render();

  if (moves <= 0) {
    updateMessage("🎉 游戏结束！最终分数：" + score);

    setTimeout(() => {
      alert(
        "🐼 游戏结束！\n你的最终分数：" + score
      );
    }, 150);
  } else {
    updateMessage("✨ 消除成功！继续加油！🐻");
  }
}

// 启动游戏
startGame();

</script>
</body>
</html>
